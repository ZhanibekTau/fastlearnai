name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: zhanibektau

jobs:
  # ==========================================
  # Build & push images to GHCR
  # ==========================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push fastapi
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-fastapi:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/fastlearn-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Deploy to server
  # ==========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: "docker-compose.prod.yml"
          target: "/opt/fastlearn/"

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            cd /opt/fastlearn

            # Пакеты в GHCR приватные (репозиторий private) — логинимся PAT'ом
            # с правом read:packages перед pull. Логин идемпотентен, можно
            # гонять на каждом деплое.
            # (envs: через appleboy/ssh-action не годится — требует AcceptEnv в
            # sshd_config сервера, поэтому секрет подставляется прямо в скрипт;
            # GitHub Actions маскирует его значение в логах.)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # .env лежит на сервере постоянно (создаётся один раз при первичной настройке,
            # см. DEPLOY.md) и в репозиторий не попадает.
            export IMAGE_TAG=${{ github.sha }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            sleep 3
            docker compose -f docker-compose.prod.yml ps

      - name: Health check
        run: |
          sleep 5
          curl -f ${{ secrets.APP_URL }}/health || echo "Health check endpoint not available"
        continue-on-error: true