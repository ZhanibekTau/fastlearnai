version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-fastlearn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-fastlearn_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fastlearn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    volumes:
      - uploads:/uploads/video
    environment:
      PORT: 8080
      UPLOADS_DIR: /uploads/video
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fastlearn_db}
      DB_USER: ${DB_USER:-fastlearn}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_me_dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FASTAPI_URL: http://fastapi:8001
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      EMAIL_LOGIN: ${EMAIL_LOGIN}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi:
    build: ./fastapi
    volumes:
      - uploads:/uploads/video
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GCS_BUCKET: ${GCS_BUCKET:-fastlearn-videos}
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
